<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ rootStyle }}">
<div style="height:100%; display:flex; background:#faf8f6; color:#17151a; font-family:'Plus Jakarta Sans', system-ui, sans-serif; overflow:hidden; position:relative">

  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <aside style="width:262px; flex:none; background:#1c1a21; color:#fff; display:flex; flex-direction:column; padding:22px 14px 16px">
      <div style="padding:0 10px 18px">
        <div style="font-size:10.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.4)">{{ today }}</div>
        <div style="font-family:'Bricolage Grotesque', system-ui, sans-serif; font-weight:700; font-size:22px; letter-spacing:-.02em; margin-top:7px">The desk</div>
      </div>
      <div style="font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.4); padding:0 10px 8px">Profiles</div>
      <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px">
        <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="8">
          <button data-pid="{{ p.id }}" onClick="{{ onEnter }}" style="all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; color:rgba(255,255,255,.85)" style-hover="background:rgba(255,255,255,.08)">
            <span style="{{ p.avatar }}">{{ p.initial }}</span>
            <span style="flex:1; min-width:0">
              <span style="display:block; font-size:14px; font-weight:600; letter-spacing:-.01em">{{ p.name }}</span>
              <span style="{{ p.lineStyle }}">{{ p.line }}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <button style="all:unset; cursor:pointer; margin-top:12px; padding:10px; border-radius:12px; border:1px dashed rgba(255,255,255,.24); text-align:center; font-size:13px; font-weight:600; color:rgba(255,255,255,.6)">+ Add a profile</button>
    </aside>
  </sc-if>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column">

    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <header style="flex:none; background:#1c1a21; color:#fff; padding:16px 16px 16px; display:flex; align-items:center; gap:13px">
        <button onClick="{{ toggleMenu }}" style="all:unset; cursor:pointer; display:flex; align-items:center; color:rgba(255,255,255,.8)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
        </button>
        <div style="flex:1; min-width:0">
          <div style="font-size:10.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.4)">{{ today }}</div>
          <div style="font-family:'Bricolage Grotesque', system-ui, sans-serif; font-weight:700; font-size:22px; letter-spacing:-.02em; margin-top:3px">Ask the desk</div>
        </div>
      </header>
    </sc-if>

    <div style="flex:1; overflow-y:auto; padding:{{ pad }}">
      <div style="max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:16px">

        <sc-for list="{{ thread }}" as="m" hint-placeholder-count="2">
          <div style="{{ m.wrap }}">
            <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
              <div style="{{ m.bubble }}">{{ m.text }}</div>
            </sc-if>
            <sc-if value="{{ m.isBot }}" hint-placeholder-val="{{ true }}">
              <div style="{{ m.bubble }}">
                <div style="font-size:15px; line-height:1.6">{{ m.text }}</div>
                <sc-if value="{{ m.showSummary }}" hint-placeholder-val="{{ false }}">
                  <button data-i="{{ m.i }}" onClick="{{ onExpand }}" style="{{ m.summaryStyle }}">
                    <span style="{{ m.summaryDot }}"></span>
                    <span style="flex:1; text-align:left; font-size:14px; font-weight:600">{{ m.summaryLabel }}</span>
                    <span style="font-size:12.5px; font-weight:600; color:#9b95a1">{{ m.summaryAction }}</span>
                    <span style="{{ m.summaryCaret }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
                  </button>
                </sc-if>
                <sc-for list="{{ m.visibleRows }}" as="r" hint-placeholder-count="0">
                  <button data-pid="{{ r.pid }}" onClick="{{ onEnter }}" style="{{ r.style }}">
                    <span style="{{ r.dot }}"></span>
                    <span style="flex:1; text-align:left; font-size:14.5px; font-weight:600">{{ r.title }}</span>
                    <span style="font-size:12.5px; color:#6b6570; white-space:nowrap">{{ r.profile }}</span>
                    <span style="{{ r.whenStyle }}">{{ r.when }}</span>
                  </button>
                </sc-for>
                <sc-if value="{{ m.hasNote }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:12.5px; color:#9b95a1; margin-top:10px">{{ m.note }}</div>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <div style="display:flex; flex-wrap:wrap; gap:8px; padding-top:2px">
          <sc-for list="{{ prompts }}" as="q" hint-placeholder-count="4">
            <button data-q="{{ q.text }}" onClick="{{ onPrompt }}" style="all:unset; cursor:pointer; font-size:13px; font-weight:600; color:#6b6570; background:#fff; border:1px solid rgba(23,21,26,.1); border-radius:999px; padding:8px 15px" style-hover="border-color:rgba(234,71,17,.4); color:#b8551f">{{ q.text }}</button>
          </sc-for>
        </div>

      </div>
    </div>

    <div style="flex:none; padding:{{ barPad }}; border-top:1px solid rgba(23,21,26,.09); background:#faf8f6">
      <div style="max-width:720px; margin:0 auto; display:flex; gap:9px; align-items:center">
        <input value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="Ask across every profile" style="flex:1; min-width:0; font-family:inherit; font-size:15px; padding:13px 16px; border:1px solid rgba(23,21,26,.12); border-radius:14px; background:#fff; outline:none" />
        <button onClick="{{ onSend }}" style="all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:14px; background:#1c1a21; color:#fff">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 14 0"></path><path d="m13 6 6 6-6 6"></path></svg>
        </button>
      </div>
      <div style="max-width:720px; margin:8px auto 0; font-size:11.5px; color:#9b95a1">It only ever answers about your profiles, and every answer is a row you can walk into.</div>
    </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ toggleMenu }}" style="position:absolute; inset:0; background:rgba(23,21,26,.4); z-index:20"></div>
    <div style="position:absolute; top:0; bottom:0; left:0; width:270px; box-sizing:border-box; background:#1c1a21; color:#fff; z-index:21; display:flex; flex-direction:column; padding:20px 14px 16px; box-shadow:16px 0 40px rgba(23,21,26,.3)">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 10px 16px">
        <span style="font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.4)">Profiles</span>
        <button onClick="{{ toggleMenu }}" style="all:unset; cursor:pointer; display:flex; color:rgba(255,255,255,.6)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </div>
      <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px">
        <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="8">
          <button data-pid="{{ p.id }}" onClick="{{ onEnter }}" style="all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; color:rgba(255,255,255,.85)">
            <span style="{{ p.avatar }}">{{ p.initial }}</span>
            <span style="flex:1; min-width:0">
              <span style="display:block; font-size:14.5px; font-weight:600; letter-spacing:-.01em">{{ p.name }}</span>
              <span style="{{ p.lineStyle }}">{{ p.line }}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <button style="all:unset; cursor:pointer; margin-top:12px; padding:10px; border-radius:12px; border:1px dashed rgba(255,255,255,.24); text-align:center; font-size:13px; font-weight:600; color:rgba(255,255,255,.6)">+ Add a profile</button>
    </div>
  </sc-if>

  </div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:880}}">
class Component extends DCLogic {
  state = { thread: null, draft: '', menuOpen: false, open: {} };

  answer(q, d) {
    const t = (q || '').toLowerCase();
    const items = d.todayItems || [];
    const posts = d.posts || [];
    const profs = d.profiles || [];
    const nameOf = (pid) => (profs.find(x => x.id === pid) || {}).name || '';
    const W = ['Nothing', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
    const w = (n) => W[n] || String(n);
    const lower = (n) => (W[n] || String(n)).toLowerCase();
    const many = (n, one, more) => n === 1 ? one : more;

    if (t.indexOf('stuck') > -1 || t.indexOf('waiting') > -1 || t.indexOf('yes') > -1) {
      const rows = posts.filter(p => p.stage === 'review').map(p => ({ pid: p.pid, title: p.title, profile: nameOf(p.pid), when: p.meta, late: false }));
      if (!rows.length) return { text: 'Nothing is waiting on anyone else right now.', rows, note: '' };
      return { text: w(rows.length) + ' ' + many(rows.length, 'piece is', 'pieces are') + ' sitting in review, waiting on someone else. The oldest has been there since 31 July.', rows, note: 'Opening one takes you to its review state, with the link you sent.' };
    }
    if (t.indexOf('lock') > -1 || t.indexOf('strategy') > -1) {
      const rows = profs.filter(p => p.locked === false).map(p => ({ pid: p.id, title: 'Strategy is not locked', profile: p.name, when: 'blocks Creation', late: true }));
      if (!rows.length) return { text: 'Every profile is locked. Creation is open everywhere.', rows, note: '' };
      return { text: w(rows.length) + ' ' + many(rows.length, 'profile is', 'profiles are') + ' still unlocked, so nothing can be made for ' + many(rows.length, 'it', 'them') + ' yet.', rows, note: 'Lock it from the Strategy corner inside that profile.' };
    }
    if (t.indexOf('quiet') > -1 || t.indexOf('not posted') > -1 || t.indexOf('behind') > -1) {
      const rows = profs.filter(p => posts.filter(x => x.pid === p.id).length === 0)
        .map(p => ({ pid: p.id, title: 'Nothing on the board', profile: p.name, when: 'no pieces', late: true }));
      if (!rows.length) return { text: 'Every profile has something on its board this month.', rows, note: '' };
      return { text: w(rows.length) + ' ' + many(rows.length, 'profile has', 'profiles have') + ' nothing on ' + many(rows.length, 'its', 'their') + ' board at all this month.', rows, note: 'Usually a seed problem, not a making problem.' };
    }
    if (t.indexOf('week') > -1 || t.indexOf('month') > -1 || t.indexOf('go') > -1) {
      return {
        text: 'Nine pieces went out across four profiles. The correction angle saved twice as often as the teach angle, from the same seed. Sonia is the only profile ahead of its mix target.',
        rows: [{ pid: 'rg', title: 'Salary question carousel', profile: 'ResumeGuru', when: '186 saves', late: false }],
        note: 'Ask me to turn that into a seed and it lands in her Engine.'
      };
    }
    const rows = items.filter(i => i.group !== 'waiting')
      .sort((a, b) => (a.group === 'overdue' ? 0 : 1) - (b.group === 'overdue' ? 0 : 1))
      .map(i => ({ pid: i.pid, title: i.title, profile: i.profile, when: i.when, late: i.group === 'overdue' }));
    const late = rows.filter(r => r.late).length;
    const across = (new Set(rows.map(r => r.pid))).size;
    if (!rows.length) return { text: 'Nothing needs you today. That is allowed.', rows, note: '' };
    return {
      text: w(rows.length) + ' ' + many(rows.length, 'thing needs', 'things need') + ' you today, across ' + lower(across) + ' ' + many(across, 'profile', 'profiles') + '.' +
        (late ? ' ' + w(late) + ' of ' + many(rows.length, 'it', 'them') + ' ' + many(late, 'has', 'have') + ' already slipped ' + many(late, 'its', 'their') + ' date.' : ''),
      rows, note: 'Tap any row to land inside that profile, at that thing.'
    };
  }

  send(text, d) {
    const a = this.answer(text, d);
    this.setState(s => ({
      draft: '',
      thread: (s.thread || []).concat([{ who: 'me', text }, Object.assign({ who: 'bot' }, a)])
    }));
  }

  renderVals() {
    const p = this.props, d = p.data || {}, h = p.handlers || {};
    const narrow = !!p.narrow;
    const hueOf = (pid) => ((d.profiles || []).find(x => x.id === pid) || {}).hue || '#ea4711';
    const items = d.todayItems || [];

    const opening = Object.assign({ who: 'bot' }, this.answer('', d));
    const thread = this.state.thread || [opening];

    return {
      rootStyle: 'height:' + (p.frameH || 880) + 'px; overflow:hidden;',
      wide: !narrow, narrow,
      pad: narrow ? '18px 16px 20px' : '30px 34px 20px',
      barPad: narrow ? '12px 16px 14px' : '16px 34px 18px',
      today: d.today || '',

      profiles: (d.profiles || []).map(x => {
        const late = items.filter(i => i.pid === x.id && i.group === 'overdue').length;
        return Object.assign({}, x, {
          initial: x.name.charAt(0),
          line: x.locked === false ? 'not locked' : (late ? late + ' slipped' : 'nothing overdue'),
          lineStyle: 'display:block; font-size:11.5px; margin-top:2px; color:' + (x.locked === false || late ? '#ff8a5c' : 'rgba(255,255,255,.42)') + ';',
          avatar: 'width:28px; height:28px; flex:none; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:#fff; background:' + x.hue + ';',
          chipAvatar: 'width:20px; height:20px; flex:none; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; background:' + x.hue + ';'
        });
      }),
      onEnter: (e) => h.nav({  screen: 'profile', pid: e.currentTarget.dataset.pid, app: 'creation', tab: 'board', piece: null }),

      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      onExpand: (e) => { const i = e.currentTarget.dataset.i; this.setState(s => ({ open: Object.assign({}, s.open, { [i]: !s.open[i] }) })); },
      thread: thread.map((m, i) => {
        const rows = m.rows || [];
        const foldable = narrow && rows.length > 2;
        const collapsed = foldable && !this.state.open[i];
        const late = rows.filter(r => r.late).length;
        return {
        i: String(i),
        isUser: m.who === 'me', isBot: m.who === 'bot',
        text: m.text, note: m.note || '', hasNote: !!m.note && !collapsed,
        showSummary: foldable,
        summaryLabel: rows.length + (late ? ' items, ' + late + ' slipped' : ' items'),
        summaryAction: collapsed ? 'Open' : 'Hide',
        summaryStyle: 'all:unset; cursor:pointer; box-sizing:border-box; display:flex; align-items:center; gap:11px; width:100%; margin-top:12px; padding:11px 13px; border-radius:13px; background:#f4f1ee;',
        summaryDot: 'width:8px; height:8px; border-radius:50%; flex:none; background:' + (late ? '#ea4711' : '#9b95a1') + ';',
        summaryCaret: 'display:flex; color:#9b95a1; transform:rotate(' + (collapsed ? '-90deg' : '0deg') + ');',
        wrap: 'display:flex; ' + (m.who === 'me' ? 'justify-content:flex-end;' : 'justify-content:flex-start;'),
        bubble: m.who === 'me'
          ? 'max-width:82%; background:#1c1a21; color:#fff; font-size:15px; line-height:1.5; padding:12px 16px; border-radius:18px 18px 5px 18px;'
          : 'max-width:100%; width:100%; background:#fff; border:1px solid rgba(23,21,26,.09); border-radius:18px 18px 18px 5px; padding:16px 18px; box-shadow:0 1px 2px rgba(23,21,26,.04);',
        visibleRows: (collapsed ? [] : rows).map(r => Object.assign({}, r, {
          style: 'all:unset; cursor:pointer; box-sizing:border-box; display:flex; align-items:center; gap:11px; width:100%; padding:11px 0; border-top:1px solid rgba(23,21,26,.07); margin-top:2px;',
          dot: 'width:8px; height:8px; border-radius:50%; flex:none; background:' + hueOf(r.pid) + ';',
          whenStyle: 'font-size:12.5px; font-weight:600; white-space:nowrap; color:' + (r.late ? '#c2410c' : '#9b95a1') + ';'
        }))
        };
      }),

      prompts: [
        { text: 'What needs me today?' },
        { text: 'What is stuck waiting on a yes?' },
        { text: 'Which profiles have gone quiet?' },
        { text: 'How did last month go?' },
        { text: 'Anything not locked?' },
      ],
      onPrompt: (e) => this.send(e.currentTarget.dataset.q, d),
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter' && e.target.value.trim()) this.send(e.target.value.trim(), d); },
      onSend: () => { if (this.state.draft.trim()) this.send(this.state.draft.trim(), d); },
    };
  }
}

</script>
</body>
</html>
